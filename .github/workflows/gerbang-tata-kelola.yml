name: gerbang-tata-kelola

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pemeriksa-tata-kelola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validasi konstitusi & artefak tata kelola
        run: node scripts/validate.js
